name: HeyTV Multiplatform CI/CD Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Job 1: Android & Android TV Box APK / AAB Build
  # -------------------------------------------------------------
  build-android:
    name: Build Android APK & TV Box Payload
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project Syntax
        run: flutter analyze --no-fatal-infos

      - name: Build Android APK (Release)
        run: flutter build apk --release --split-per-abi --dart-define=NEON_DB_URL="${{ secrets.NEON_DATABASE_URL }}"

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HeyTV-Android-APKs
          path: build/app/outputs/flutter-apk/*.apk

  # -------------------------------------------------------------
  # Job 2: iPhone (iOS) Runner Payload Build
  # -------------------------------------------------------------
  build-ios:
    name: Build iPhone (iOS) Runner Payload
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application Payload (No Code-Signing)
        run: flutter build ios --release --no-codesign

      - name: Compress iOS Payload
        run: |
          cd build/ios/iphoneos
          zip -r HeyTV-iOS-Payload.zip Runner.app

      - name: Upload iOS Runner Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeyTV-iOS-Runner-Bundle
          path: build/ios/iphoneos/HeyTV-iOS-Payload.zip

  # -------------------------------------------------------------
  # Job 3: Windows Desktop (.exe) Build
  # -------------------------------------------------------------
  build-windows:
    name: Build Windows Desktop App (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Target
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Desktop Release
        run: flutter build windows --release

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeyTV-Windows-Desktop
          path: build/windows/runner/Release/
